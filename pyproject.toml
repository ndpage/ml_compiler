[project]
name = "ml_compiler"
version = "0.0.1"
description = "Experimental ML compiler: ONNX to C for ESP32 and embedded targets"
authors = [ { name = "Your Name", email = "you@example.com" } ]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["onnx", "compiler", "embedded", "esp32", "inference"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
onnx = ["onnx>=1.15.0"]
dev = ["pytest>=7.0.0", "mypy>=1.0.0", "ruff>=0.5.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

